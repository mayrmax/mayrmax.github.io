server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Behind Coolify's proxy nginx cannot know the public scheme or port, so
    # emit relative Location headers instead of guessing http://localhost.
    absolute_redirect off;

    # Astro builds with `build.format: 'file'`, so the public URL `/about` is
    # `about.html` on disk and `/de/about` is `de/about.html`. Without the
    # `$uri.html` step every page except the home page would 404.
    # The site has no trailing-slash URLs, so fold /about/ onto /about rather
    # than 404ing. The trailing `+` keeps "/" itself out of this.
    rewrite ^/(.+)/$ /$1 permanent;

    # Retired by the redesign: projects and references became /work, and the
    # theses moved to the education part of /about.
    rewrite ^(/de)?/projects$ $1/work permanent;
    rewrite ^(/de)?/publications$ $1/about#theses permanent;

    # The five 2018 posts on the decentralised web became one essay; each old
    # URL lands on its section.
    rewrite ^(/de)?/blog/decentralized-1$ $1/blog/decentralized-web permanent;
    rewrite ^/blog/decentralized-2$ /blog/decentralized-web#data-pods permanent;
    rewrite ^/blog/decentralized-3$ /blog/decentralized-web#a-personal-api permanent;
    rewrite ^/blog/decentralized-4$ /blog/decentralized-web#a-digital-soul permanent;
    rewrite ^/blog/decentralized-5$ /blog/decentralized-web#autonomous-agents permanent;
    rewrite ^/de/blog/decentralized-2$ /de/blog/decentralized-web#datapods permanent;
    rewrite ^/de/blog/decentralized-3$ /de/blog/decentralized-web#eine-pers%C3%B6nliche-api permanent;
    rewrite ^/de/blog/decentralized-4$ /de/blog/decentralized-web#eine-digitale-seele permanent;
    rewrite ^/de/blog/decentralized-5$ /de/blog/decentralized-web#autonome-agenten permanent;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Filenames under /_astro/ contain a content hash, so they can be cached
    # forever. Everything else revalidates, which makes a redeploy show up at
    # the next request instead of after a cache expiry.
    add_header Cache-Control "no-cache" always;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    # Fonts and images are already compressed; serving them to another origin is
    # fine but not something this site needs.
    location = /robots.txt {
        access_log off;
    }
}
