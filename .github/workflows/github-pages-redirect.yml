# The site itself is hosted on Coolify. GitHub Pages keeps serving
# mayrmax.github.io, but only as a set of redirect stubs pointing at the new
# domain, so the old URLs do not die. See scripts/build-redirects.mjs.
name: Publish redirects to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REDIRECT_TARGET: https://mayrmax.com

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the one
# in progress and the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Still the only CI the project has, so keep gating on it even though
      # the artifact published below is just the redirects.
      - name: Check
        run: npm run check

      - name: Build
        env:
          SITE_URL: ${{ env.REDIRECT_TARGET }}
        run: npm run build

      # Derived from the build output, so a new page gets a redirect stub
      # automatically instead of silently 404ing on the old domain.
      - name: Generate redirects
        run: npm run build:redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
